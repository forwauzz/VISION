# Frontend + serverless API. Set OPENAI_API_KEY in Netlify env for transcription and vision.
# Set BASIC_AUTH_USERNAME + BASIC_AUTH_PASSWORD in Netlify env to password-protect the site.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Password protection (Basic Auth). Runs when BASIC_AUTH_PASSWORD is set.
[[edge_functions]]
  path = "/*"
  function = "basic-auth"
  excludedPath = ["/.netlify/*"]

# Rewrite /api/* to Netlify Functions (so frontend can call same origin; no VITE_API_BASE_URL needed).
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/transcribe"
  to = "/.netlify/functions/transcribe"
  status = 200
  force = true

[[redirects]]
  from = "/api/vision/describe-frames"
  to = "/.netlify/functions/describe-frames"
  status = 200
  force = true

[[redirects]]
  from = "/api/vision/summarize-session"
  to = "/.netlify/functions/summarize-session"
  status = 200
  force = true

# SPA fallback: serve index.html for client-side routes (e.g. /demo, /login) so React Router handles them.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
